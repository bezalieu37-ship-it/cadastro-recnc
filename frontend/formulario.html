<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro RECNC - Novo Cadastro</title>
  <meta name="description" content="Formulário de cadastro de pessoas - Cadastro RECNC">
  
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/minimal-fontawesome.min.css">
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .form-label-custom {
      font-weight: 500;
      color: var(--dark);
    }
    
    .form-control-custom {
      border-radius: 8px;
      border: 1px solid #dee2e6;
      padding: 12px 14px;
      font-size: 1rem;
    }
    
    .form-control-custom:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.25);
    }
    
    .preview-image {
      max-width: 200px;
      max-height: 200px;
      object-fit: cover;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      background: #f8f9fa;
    }
    
    .file-upload-label {
      cursor: pointer;
      border: 2px dashed #6c757d;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s;
    }
    
    .file-upload-label:hover {
      border-color: var(--primary-color);
      background: rgba(108, 99, 255, 0.05);
    }
    
    .file-upload-label input {
      display: none;
    }
    
    .radio-custom .form-check-input {
      width: 1.2rem;
      height: 1.2rem;
    }
    
    .radio-custom .form-check-label {
      font-weight: normal;
    }
  </style>
</head>
<body>

<!-- Top navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
      <i class="fas fa-user-tie me-2"></i>Cadastro RECNC
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="dashboard.html">Painel</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="lista.html">Lista</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row">
    <div class="col-12">
      <div class="card fade-in-up">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h4><i class="fas fa-user-plus me-2"></i>Novo Cadastro</h4>
          <button class="btn btn-link text-secondary" onclick="window.location.href='lista.html'">Voltar</button>
        </div>
        <div class="card-body">
          <form id="cadastroForm">
            <input type="hidden" id="pessoaId">
            
            <div class="row mb-3">
              <div class="col-12">
                <label class="form-label-custom" for="nomeCompleto">Nome Completo <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-custom" id="nomeCompleto" required>
              </div>
            </div>

            <!-- ======endereco com sub-abas===== -->
            <div class="mb-3">
              <label class="form-label-custom">Endereco Completo <span class="text-danger">*</span></label>

              <!-- Sub-abas Endereco -->
              <ul class="nav nav-tabs" id="enderecoTabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="tab-cep" data-bs-toggle="tab" data-bs-target="#pane-cep" type="button" role="tab">
                    <i class="fas fa-map-marker-alt me-1"></i>CEP
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="tab-rua" data-bs-toggle="tab" data-bs-target="#pane-rua" type="button" role="tab">
                    <i class="fas fa-road me-1"></i>Rua / Numero
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="tab-bairro" data-bs-toggle="tab" data-bs-target="#pane-bairro" type="button" role="tab">
                    <i class="fas fa-building me-1"></i>Bairro / Loteamento
                  </button>
                </li>
              </ul>

              <div class="tab-content border border-top-0 rounded-bottom p-3 bg-white" id="enderecoTabContent">
                <!-- Aba CEP -->
                <div class="tab-pane fade show active" id="pane-cep" role="tabpanel">
                  <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                      <label class="form-label-custom small" for="cep">CEP <span class="text-danger">*</span></label>
                      <input type="text" class="form-control form-control-custom" id="cep" placeholder="00000-000" maxlength="9" required>
                    </div>
                    <div class="col-md-3">
                      <button type="button" class="btn btn-primary w-100" id="btnBuscarCep" style="height:38px">
                        <i class="fas fa-search me-1"></i>Buscar
                      </button>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label-custom small" for="estado">Estado</label>
                      <input type="text" class="form-control form-control-custom" id="estado" placeholder="Ex: SP" maxlength="2">
                    </div>
                  </div>
                  <div class="row g-2 mt-1">
                    <div class="col-md-12">
                      <label class="form-label-custom small" for="cidade">Cidade</label>
                      <input type="text" class="form-control form-control-custom" id="cidade" placeholder="Ex: Sao Paulo">
                    </div>
                  </div>
                  <small class="text-secondary d-block mt-2">Digite o CEP e clique em Buscar para preencher automaticamente</small>
                </div>
                <!-- Aba Rua / Numero -->
                <div class="tab-pane fade" id="pane-rua" role="tabpanel">
                  <div class="row g-2">
                    <div class="col-md-8">
                      <label class="form-label-custom small" for="rua">Rua / Avenida <span class="text-danger">*</span></label>
                      <input type="text" class="form-control form-control-custom" id="rua" placeholder="Ex: Rua das Flores" required>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label-custom small" for="numero">Numero <span class="text-danger">*</span></label>
                      <input type="text" class="form-control form-control-custom" id="numero" placeholder="Ex: 123" required>
                    </div>
                  </div>
                </div>
                <!-- Aba Bairro / Loteamento -->
                <div class="tab-pane fade" id="pane-bairro" role="tabpanel">
                  <div class="row g-2">
                    <div class="col-md-12">
                      <label class="form-label-custom small" for="bairro">Bairro ou Loteamento <span class="text-danger">*</span></label>
                      <input type="text" class="form-control form-control-custom" id="bairro" placeholder="Ex: Centro ou Loteamento Sol Nascente" required>
                    </div>
                  </div>
                </div>
              </div>

              <input type="hidden" id="endereco" name="endereco">
            </div>

            <div class="row mb-3">
              <div class="col-12">
                <label class="form-label-custom" for="pontoReferencia">Ponto de Referencia <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-custom" id="pontoReferencia" required>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label-custom small" for="telefone">Telefone / WhatsApp <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-custom" id="telefone" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom small" for="acompanhante">Acompanhante</label>
                <select class="form-select form-select-custom" id="acompanhante" aria-label="Acompanhante">
                  <option value="">Selecione...</option>
                </select>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-12">
                <div class="radio-custom">
                  <input class="form-check-input" type="radio" name="tipoCadastro" id="novoNascimento" value="novo_nascimento" required>
                  <label class="form-check-label" for="novoNascimento">
                    <i class="fas fa-baby me-2"></i>Novo Nascimento
                  </label>
                </div>
                <div class="radio-custom">
                  <input class="form-check-input" type="radio" name="tipoCadastro" id="reconciliacao" value="reconciliacao">
                  <label class="form-check-label" for="reconciliacao">
                    <i class="fas fa-redo me-2"></i>Reconciliação
                  </label>
                </div>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label-custom">Foto da Pessoa</label>
              <div class="file-upload-label" id="fileUploadLabel">
                <i class="fas fa-image me-2"></i>Clique para upload ou arraste a imagem
                <input type="file" id="fotoUpload" accept="image/jpeg,image/png,image/webp">
              </div>
              <img id="previewImage" src="#" alt="Preview da foto" class="preview-image mt-2 d-none">
              <small class="text-secondary d-block mt-1">Formatos: JPG, PNG, WEBP | Máximo: 4MB</small>
            </div>
            
            <div class="mb-3">
              <label class="form-label-custom">Arquivo (PDF, DOC, etc.)</label>
              <div class="file-upload-label" id="fileUploadLabel2">
                <i class="fas fa-file me-2"></i>Clique para upload
                <input type="file" id="arquivoUpload" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
              </div>
              <small class="text-secondary d-block mt-1">Formatos: PDF, DOC, DOCX | Máximo: 10MB</small>
              <div id="arquivoSelecionado" class="mt-2 d-none">
                <span id="nomeArquivo"></span>
                <button type="button" class="btn btn-link btn-sm text-danger" onclick="limparArquivo()">Remover</button>
              </div>
            </div>
            
            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary-custom">
                <i class="fas fa-save me-2"></i>Salvar Cadastro
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Check authentication
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    
    if (!token) {
      window.location.href = 'index.html';
    }
    
    // Load users for Acompanhante dropdown
    async function carregarUsuariosDropdown() {
      try {
        const response = await fetch('api/usuarios/list', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const usuarios = await response.json();
        
        const select = document.getElementById('acompanhante');
        if (!select) return;
        
        // Clear existing options (except the first "Selecione...")
        select.innerHTML = '<option value="">Selecione...</option>';
        
        usuarios.forEach(u => {
          const option = document.createElement('option');
          option.value = u.id;
          option.textContent = u.nome;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Erro ao carregar usuários:', error);
      }
    }
    
    // Initialize dropdown when DOM is ready
    document.addEventListener('DOMContentLoaded', carregarUsuariosDropdown);
    
    // DOM Elements
    const cadastroForm = document.getElementById('cadastroForm');
    const fotoUpload = document.getElementById('fotoUpload');
    const previewImage = document.getElementById('previewImage');
    const fileUploadLabel = document.getElementById('fileUploadLabel');
    const arquivoUpload = document.getElementById('arquivoUpload');
    const nomeArquivo = document.getElementById('nomeArquivo');
    const pessoaId = new URLSearchParams(window.location.search).get('id');

    // ====== CEP AUTO-FILL (ViaCEP API) ======
    const cepInput = document.getElementById('cep');
    const btnBuscarCep = document.getElementById('btnBuscarCep');

    async function buscarCep() {
      const cep = cepInput.value.replace(/\D/g, '');
      if (cep.length !== 8) {
        alert('Digite um CEP valido com 8 digitos.');
        return;
      }

      btnBuscarCep.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Buscando...';
      btnBuscarCep.disabled = true;

      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await response.json();

        if (!data.erro) {
          document.getElementById('estado').value = data.uf || '';
          document.getElementById('cidade').value = data.localidade || '';
          document.getElementById('bairro').value = data.bairro || '';
          document.getElementById('rua').value = data.logradouro || '';

          // Auto-switch to Rua/Numero tab
          const tabRua = document.getElementById('tab-rua');
          if (tabRua) {
            const bsTab = new bootstrap.Tab(tabRua);
            bsTab.show();
            setTimeout(() => {
              document.getElementById('numero').focus();
            }, 300);
          }
        } else {
          alert('CEP nao encontrado. Verifique e tente novamente.');
        }
      } catch (err) {
        console.error('Erro ViaCEP:', err);
        alert('Erro ao consultar CEP. Verifique sua conexao.');
      } finally {
        btnBuscarCep.innerHTML = '<i class="fas fa-search me-1"></i>Buscar';
        btnBuscarCep.disabled = false;
      }
    }

    if (btnBuscarCep) {
      btnBuscarCep.addEventListener('click', buscarCep);
    }

    if (cepInput) {
      // Also trigger on blur
      cepInput.addEventListener('blur', buscarCep);

      // Format CEP as user types: 00000-000
      cepInput.addEventListener('input', function() {
        let v = this.value.replace(/\D/g, '');
        if (v.length > 5) v = v.substring(0, 5) + '-' + v.substring(5, 8);
        this.value = v;
      });
    }

    // Load existing person if editing
    if (pessoaId) {
      // Em um sistema completo, aqui faríamos o fetch para carregar os dados
    }
    
    // Image preview
    if (fotoUpload && previewImage) {
      fotoUpload.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
          // Validate file type
          if (!file.type.startsWith('image/')) {
            alert('Por favor, selecione um arquivo de imagem válido.');
            this.value = '';
            return;
          }
          
          // Validate file size (4MB)
          if (file.size > 4 * 1024 * 1024) {
            alert('A foto deve ter no máximo 4MB.');
            this.value = '';
            return;
          }
          
          const reader = new FileReader();
          reader.onload = function(e) {
            previewImage.src = e.target.result;
            previewImage.classList.remove('d-none');
          };
          reader.readAsDataURL(file);
        }
      });
    }
    
    // File upload label click
    if (fileUploadLabel) {
      fileUploadLabel.addEventListener('click', function() {
        fotoUpload.click();
      });
    }
    
    // File selection for documento
    if (arquivoUpload) {
      arquivoUpload.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
          // Validate file type
          const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
          if (!allowedTypes.includes(file.type)) {
            // Try to validate by extension
            const extensao = file.name.split('.').pop().toLowerCase();
            if (!['pdf', 'doc', 'docx'].includes(extensao)) {
              alert('Por favor, selecione um arquivo válido (PDF, DOC, DOCX).');
              this.value = '';
              return;
            }
          }
          
          // Validate file size (10MB)
          if (file.size > 10 * 1024 * 1024) {
            alert('O arquivo deve ter no máximo 10MB.');
            this.value = '';
            return;
          }
          
          nomeArquivo.textContent = file.name;
          nomeArquivo.parentElement.classList.remove('d-none');
        }
      });
    }
    
    // Limpar arquivo
    function limparArquivo() {
      arquivoUpload.value = '';
      nomeArquivo.textContent = '';
      nomeArquivo.parentElement.classList.add('d-none');
    }
    
    // ====== Montar endereco completo ======
    function montarEndereco() {
      const rua = document.getElementById('rua')?.value.trim() || '';
      const numero = document.getElementById('numero')?.value.trim() || '';
      const bairro = document.getElementById('bairro')?.value.trim() || '';
      const cidade = document.getElementById('cidade')?.value.trim() || '';
      const estado = document.getElementById('estado')?.value.trim() || '';
      const cep = document.getElementById('cep')?.value.trim() || '';
      const partes = [];
      if (rua) partes.push(numero ? `${rua}, ${numero}` : rua);
      if (bairro) partes.push(bairro);
      if (cidade) partes.push(cidade);
      if (estado) partes.push(estado);
      if (cep) partes.push(`CEP: ${cep}`);
      return partes.join(' - ');
    }

    // Form submission
    if (cadastroForm) {
      cadastroForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nomeCompleto = document.getElementById('nomeCompleto').value.trim();
        const endereco = montarEndereco();
        const pontoReferencia = document.getElementById('pontoReferencia').value.trim();
        const telefone = document.getElementById('telefone').value.trim();
        const tipoCadastro = document.querySelector('input[name="tipoCadastro"]:checked')?.value;
        const acompanhante = document.getElementById('acompanhante').value.trim();

        let fotoUrl = '';
        if (previewImage && !previewImage.classList.contains('d-none')) {
          fotoUrl = previewImage.src;
        }

        let arquivoUrl = '';
        if (nomeArquivo && !nomeArquivo.classList.contains('d-none')) {
          arquivoUrl = `arquivos/${nomeArquivo.textContent}`;
        }

        if (!nomeCompleto || !endereco || !pontoReferencia || !telefone || !tipoCadastro) {
          alert('Por favor, preencha todos os campos obrigatorios (CEP, Rua, Numero, Bairro).');
          return;
        }

        try {
          const response = await fetch('api/pessoas', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              nome_completo: nomeCompleto,
              endereco,
              ponto_referencia: pontoReferencia,
              telefone,
              tipo_cadastro: tipoCadastro,
              acompanhante,
              foto_url: fotoUrl,
              arquivo_url: arquivoUrl,
              cadastrado_por: user.id
            })
          });

          const data = await response.json();

          if (response.ok) {
            alert(data.message || 'Cadastro salvo com sucesso!');
            window.location.href = 'lista.html';
          } else {
            alert(data.error || 'Erro ao salvar cadastro.');
          }
        } catch (error) {
          console.error('Error:', error);
          alert('Erro de conexao. Verifique se o backend esta rodando.');
        }
      });
    }
  </script>
</body>
</html>
