<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro RECNC - Novo Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-label-custom { font-weight: 500; color: #212529; }
    .form-control-custom, .form-select-custom {
      border-radius: 8px; border: 1px solid #dee2e6; padding: 12px 14px; font-size: 1rem;
    }
    .form-control-custom:focus, .form-select-custom:focus {
      border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(108,99,255,0.25);
    }
    .preview-image { max-width: 200px; max-height: 200px; object-fit: cover; border: 2px solid #dee2e6; border-radius: 8px; }
    .radio-custom { display: flex; gap: 16px; flex-wrap: wrap; }
    .radio-custom .form-check { display: flex; align-items: center; gap: 8px; }
    .radio-custom .form-check-input { width: 1.2rem; height: 1.2rem; }
    .section-title { font-weight: 700; color: #495057; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
      <i class="fas fa-user-tie me-2"></i>Cadastro RECNC
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Painel</a></li>
        <li class="nav-item"><a class="nav-link" href="lista.html">Lista</a></li>
        <li class="nav-item"><a class="nav-link" href="acompanhamentos.html"><i class="fas fa-user-check me-1"></i>Acompanhamentos</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card" style="border-radius:14px; border:none; box-shadow:0 2px 12px rgba(0,0,0,0.06);">
        <div class="card-header d-flex justify-content-between align-items-center" style="border-radius:14px 14px 0 0; background:white; border-bottom:1px solid #f0f0f0;">
          <h5 class="mb-0 fw-bold"><i class="fas fa-user-plus me-2 text-primary"></i>Novo Cadastro</h5>
          <a href="dashboard.html" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Voltar</a>
        </div>
        <div class="card-body p-3 p-md-4">
          <form id="cadastroForm">
            <input type="hidden" id="pessoaId">

            <!-- Dados Pessoais -->
            <div class="section-title"><i class="fas fa-user"></i> Dados Pessoais</div>

            <div class="mb-3">
              <label class="form-label-custom" for="nomeCompleto">Nome Completo <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-custom" id="nomeCompleto" placeholder="Nome completo da pessoa" required>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label-custom" for="dataNascimento">Data de Nascimento</label>
                <input type="date" class="form-control form-control-custom" id="dataNascimento">
              </div>
              <div class="col-md-6">
                <label class="form-label-custom" for="telefone">Telefone / WhatsApp <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-custom" id="telefone" placeholder="(00) 00000-0000" required>
              </div>
            </div>

            <!-- Endereco -->
            <div class="section-title mt-4"><i class="fas fa-map-marker-alt"></i> Endereço</div>

            <div class="mb-3">
              <ul class="nav nav-tabs" id="enderecoTabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="tab-cep" data-bs-toggle="tab" data-bs-target="#pane-cep" type="button" role="tab">
                    <i class="fas fa-map-pin me-1"></i>CEP
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="tab-rua" data-bs-toggle="tab" data-bs-target="#pane-rua" type="button" role="tab">
                    <i class="fas fa-road me-1"></i>Rua / Número
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="tab-bairro" data-bs-toggle="tab" data-bs-target="#pane-bairro" type="button" role="tab">
                    <i class="fas fa-building me-1"></i>Bairro
                  </button>
                </li>
              </ul>
              <div class="tab-content border border-top-0 rounded-bottom p-3 bg-white">
                <!-- Aba CEP (OPCIONAL) -->
                <div class="tab-pane fade show active" id="pane-cep" role="tabpanel">
                  <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                      <label class="form-label-custom small" for="cep">CEP <small class="text-muted">(opcional)</small></label>
                      <input type="text" class="form-control form-control-custom" id="cep" placeholder="00000-000" maxlength="9">
                    </div>
                    <div class="col-md-3">
                      <button type="button" class="btn btn-primary w-100" id="btnBuscarCep" style="height:38px">
                        <i class="fas fa-search me-1"></i>Buscar
                      </button>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label-custom small" for="estado">Estado</label>
                      <input type="text" class="form-control form-control-custom" id="estado" placeholder="SP" maxlength="2">
                    </div>
                  </div>
                  <div class="row g-2 mt-1">
                    <div class="col-md-12">
                      <label class="form-label-custom small" for="cidade">Cidade</label>
                      <input type="text" class="form-control form-control-custom" id="cidade" placeholder="Ex: São Paulo">
                    </div>
                  </div>
                  <small class="text-muted d-block mt-2"><i class="fas fa-info-circle me-1"></i>Opcional. Digite o CEP e clique em Buscar para preencher automaticamente.</small>
                </div>
                <!-- Aba Rua/Numero -->
                <div class="tab-pane fade" id="pane-rua" role="tabpanel">
                  <div class="row g-2">
                    <div class="col-md-8">
                      <label class="form-label-custom small" for="rua">Rua / Avenida <span class="text-danger">*</span></label>
                      <input type="text" class="form-control form-control-custom" id="rua" placeholder="Ex: Rua das Flores" required>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label-custom small" for="numero">Número <span class="text-danger">*</span></label>
                      <input type="text" class="form-control form-control-custom" id="numero" placeholder="123" required>
                    </div>
                  </div>
                </div>
                <!-- Aba Bairro -->
                <div class="tab-pane fade" id="pane-bairro" role="tabpanel">
                  <div class="row g-2">
                    <div class="col-md-12">
                      <label class="form-label-custom small" for="bairro">Bairro ou Loteamento <span class="text-danger">*</span></label>
                      <input type="text" class="form-control form-control-custom" id="bairro" placeholder="Ex: Centro" required>
                    </div>
                  </div>
                </div>
              </div>
              <input type="hidden" id="endereco" name="endereco">
            </div>

            <div class="mb-3">
              <label class="form-label-custom" for="pontoReferencia">Ponto de Referência <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-custom" id="pontoReferencia" placeholder="Ex: Em frente a padaria" required>
            </div>

            <!-- Tipo e Acompanhamento -->
            <div class="section-title mt-4"><i class="fas fa-clipboard-check"></i> Tipo e Acompanhamento</div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label-custom">Tipo de Cadastro <span class="text-danger">*</span></label>
                <div class="radio-custom mt-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipoCadastro" id="novoNascimento" value="novo_nascimento" required>
                    <label class="form-check-label" for="novoNascimento">
                      <i class="fas fa-baby me-1 text-success"></i> NC
                    </label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipoCadastro" id="reconciliacao" value="reconciliacao">
                    <label class="form-check-label" for="reconciliacao">
                      <i class="fas fa-handshake me-1 text-warning"></i> REC
                    </label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipoCadastro" id="novoCongregado" value="novo_congregado">
                    <label class="form-check-label" for="novoCongregado">
                      <i class="fas fa-church me-1 text-info"></i> NCGR
                    </label>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom" for="acompanhante">Acompanhamento <span class="text-danger">*</span></label>
                <select class="form-select form-select-custom" id="acompanhante" required>
                  <option value="">Selecione...</option>
                </select>
              </div>
            </div>

            <!-- Data de Cadastro -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label-custom">Data de Cadastro</label>
                <input type="date" class="form-control form-control-custom" id="dataCadastro">
                <small class="text-muted">Deixe vazio para usar a data atual.</small>
              </div>
            </div>

            <!-- Foto -->
            <div class="section-title mt-4"><i class="fas fa-camera"></i> Foto</div>

            <div class="mb-3">
              <label class="form-label-custom">Foto da Pessoa <small class="text-muted">(opcional)</small></label>
              <div class="file-upload-label" id="fileUploadLabel" style="cursor:pointer; border:2px dashed #dee2e6; border-radius:10px; padding:20px; text-align:center; transition:all 0.2s;" onmouseenter="this.style.borderColor='#0d6efd'" onmouseleave="this.style.borderColor='#dee2e6'">
                <i class="fas fa-cloud-upload-alt me-2 text-primary"></i><span class="text-muted">Clique para selecionar uma foto</span>
                <input type="file" id="fotoUpload" accept="image/jpeg,image/png,image/webp" style="display:none;">
              </div>
              <img id="previewImage" src="#" alt="Preview" class="preview-image mt-2 d-none">
              <small class="text-muted d-block mt-1"><i class="fas fa-info-circle me-1"></i>JPG, PNG ou WEBP | Máximo 4MB</small>
            </div>

            <!-- Submit -->
            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary btn-lg" id="btnSalvar" style="border-radius:10px; padding:14px; font-weight:600;">
                <i class="fas fa-save me-2"></i>Salvar Cadastro
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function() {
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token) { window.location.href = 'index.html'; return; }

  // Esconder link acompanhamentos para não-admin
  if ((user.perfil || '').toLowerCase() !== 'admin') {
    document.querySelectorAll('a[href="acompanhamentos.html"]').forEach(a => a.parentElement.style.display = 'none');
  }

  const cadastroForm = document.getElementById('cadastroForm');
  const fotoUpload = document.getElementById('fotoUpload');
  const previewImage = document.getElementById('previewImage');
  const fileUploadLabel = document.getElementById('fileUploadLabel');
  const btnSalvar = document.getElementById('btnSalvar');

  // Load users for Acompanhamento dropdown
  let dropdownPronto = null; // Promise que resolve quando dropdown carrega
  async function carregarUsuariosDropdown() {
    try {
      const res = await fetch('api/usuarios/list', { headers: { 'Authorization': 'Bearer ' + token } });
      const usuarios = await res.json();
      const select = document.getElementById('acompanhante');
      select.innerHTML = '<option value="">Selecione...</option>';
      usuarios.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id;
        opt.textContent = u.nome;
        select.appendChild(opt);
      });
    } catch (e) { console.error('Erro ao carregar usuarios:', e); }
  }
  dropdownPronto = carregarUsuariosDropdown();

  // =========== MODO EDICAO ===========
  const urlParams = new URLSearchParams(window.location.search);
  const editId = urlParams.get('id');
  let editFotoAtual = '';

  async function carregarParaEdicao(id) {
    try {
      const res = await fetch('api/pessoas/' + id, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) throw new Error('Pessoa nao encontrada');
      const p = await res.json();

      // Mudar titulo
      document.querySelector('.card-header h5').innerHTML = '<i class="fas fa-user-edit me-2 text-primary"></i>Editar Cadastro';
      document.title = 'Cadastro RECNC - Editar Cadastro';
      document.getElementById('btnSalvar').innerHTML = '<i class="fas fa-save me-2"></i>Salvar Alterações';
      document.getElementById('pessoaId').value = p.id;
      editFotoAtual = p.foto_url || '';

      // Preencher campos
      document.getElementById('nomeCompleto').value = p.nome_completo || '';
      document.getElementById('dataNascimento').value = p.data_nascimento || '';
      document.getElementById('telefone').value = p.telefone || '';
      document.getElementById('pontoReferencia').value = p.ponto_referencia || '';

      // Tipo cadastro (radio)
      if (p.tipo_cadastro) {
        const radio = document.querySelector('input[name="tipoCadastro"][value="' + p.tipo_cadastro + '"]');
        if (radio) radio.checked = true;
      }

      // Data cadastro
      if (p.data_cadastro) {
        const dt = new Date(p.data_cadastro);
        document.getElementById('dataCadastro').value = dt.toISOString().slice(0, 10);
      }

      // Endereco — preencher campos individuais se possivel
      if (p.endereco) {
        // Tentar parsear: "Rua X, 123 - Bairro - Cidade - UF - CEP: 00000-000"
        const partes = p.endereco.split(' - ');
        if (partes.length >= 4) {
          // Ultimo pode ser CEP
          const lastPart = partes[partes.length - 1];
          if (lastPart.startsWith('CEP:')) {
            document.getElementById('cep').value = lastPart.replace('CEP:', '').trim();
            partes.pop();
          }
          if (partes.length >= 3) {
            document.getElementById('estado').value = partes.pop().trim();
            document.getElementById('cidade').value = partes.pop().trim();
            document.getElementById('bairro').value = partes.pop().trim();
          }
          if (partes.length >= 1) {
            const ruaNum = partes.join(' - ').trim();
            const commaIdx = ruaNum.lastIndexOf(',');
            if (commaIdx > -1) {
              document.getElementById('rua').value = ruaNum.substring(0, commaIdx).trim();
              document.getElementById('numero').value = ruaNum.substring(commaIdx + 1).trim();
            } else {
              document.getElementById('rua').value = ruaNum;
            }
          }
          // Ativar aba de rua
          const tabRua = document.getElementById('tab-rua');
          if (tabRua) new bootstrap.Tab(tabRua).show();
        } else {
          // Fallback: colocar endereco completo na aba rua
          document.getElementById('rua').value = p.endereco;
          document.getElementById('numero').value = '';
          const tabRua = document.getElementById('tab-rua');
          if (tabRua) new bootstrap.Tab(tabRua).show();
        }
      }

      // Acompanhante — AGUARDAR dropdown carregar completamente antes de selecionar
      if (dropdownPronto) await dropdownPronto;
      if (p.acompanhante) {
        const sel = document.getElementById('acompanhante');
        // Garantir que a opção existe antes de setar
        const optExists = Array.from(sel.options).some(o => String(o.value) === String(p.acompanhante));
        if (optExists) {
          sel.value = String(p.acompanhante);
        }
      }

      // Foto preview
      if (p.foto_url) {
        previewImage.src = p.foto_url;
        previewImage.classList.remove('d-none');
      }
    } catch (e) {
      console.error('Erro ao carregar pessoa:', e);
      alert('Erro ao carregar dados para edição.');
      window.location.href = 'lista.html';
    }
  }

  if (editId) carregarParaEdicao(editId);

  // CEP auto-fill
  const cepInput = document.getElementById('cep');
  const btnBuscarCep = document.getElementById('btnBuscarCep');

  async function buscarCep() {
    const cep = cepInput.value.replace(/\D/g, '');
    if (cep.length !== 8) { alert('Digite um CEP válido com 8 dígitos.'); return; }
    btnBuscarCep.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Buscando...';
    btnBuscarCep.disabled = true;
    try {
      const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      const data = await res.json();
      if (!data.erro) {
        document.getElementById('estado').value = data.uf || '';
        document.getElementById('cidade').value = data.localidade || '';
        document.getElementById('bairro').value = data.bairro || '';
        document.getElementById('rua').value = data.logradouro || '';
        const tabRua = document.getElementById('tab-rua');
        if (tabRua) { new bootstrap.Tab(tabRua).show(); setTimeout(() => document.getElementById('numero').focus(), 300); }
      } else {
        alert('CEP não encontrado. Preencha manualmente.');
      }
    } catch (e) { alert('Erro ao consultar CEP.'); }
    finally { btnBuscarCep.innerHTML = '<i class="fas fa-search me-1"></i>Buscar'; btnBuscarCep.disabled = false; }
  }

  if (btnBuscarCep) btnBuscarCep.addEventListener('click', buscarCep);
  if (cepInput) {
    cepInput.addEventListener('blur', buscarCep);
    cepInput.addEventListener('input', function() {
      let v = this.value.replace(/\D/g, '');
      if (v.length > 5) v = v.substring(0, 5) + '-' + v.substring(5, 8);
      this.value = v;
    });
  }

  // Image preview
  let selectedFile = null;
  if (fileUploadLabel) {
    fileUploadLabel.addEventListener('click', () => fotoUpload.click());
  }
  if (fotoUpload) {
    fotoUpload.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Selecione uma imagem válida.'); this.value = ''; return; }
      if (file.size > 5 * 1024 * 1024) { alert('Máximo 5MB.'); this.value = ''; return; }
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => { previewImage.src = e.target.result; previewImage.classList.remove('d-none'); };
      reader.readAsDataURL(file);
    });
  }

  // Montar endereco
  function montarEndereco() {
    const rua = document.getElementById('rua')?.value.trim() || '';
    const numero = document.getElementById('numero')?.value.trim() || '';
    const bairro = document.getElementById('bairro')?.value.trim() || '';
    const cidade = document.getElementById('cidade')?.value.trim() || '';
    const estado = document.getElementById('estado')?.value.trim() || '';
    const cep = document.getElementById('cep')?.value.trim() || '';
    const partes = [];
    if (rua) partes.push(numero ? `${rua}, ${numero}` : rua);
    if (bairro) partes.push(bairro);
    if (cidade) partes.push(cidade);
    if (estado) partes.push(estado);
    if (cep) partes.push(`CEP: ${cep}`);
    return partes.join(' - ');
  }

  // Submit
  cadastroForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const nomeCompleto = document.getElementById('nomeCompleto').value.trim();
    const dataNascimento = document.getElementById('dataNascimento').value;
    const telefone = document.getElementById('telefone').value.trim();
    const endereco = montarEndereco();
    const pontoReferencia = document.getElementById('pontoReferencia').value.trim();
    const tipoCadastro = document.querySelector('input[name="tipoCadastro"]:checked')?.value;
    const acompanhante = document.getElementById('acompanhante').value;

    // Validacoes
    if (!nomeCompleto) { alert('Preencha o Nome Completo.'); return; }
    if (!telefone) { alert('Preencha o Telefone.'); return; }
    if (!endereco) { alert('Preencha o endereço (Rua, Número e Bairro).'); return; }
    if (!pontoReferencia) { alert('Preencha o Ponto de Referência.'); return; }
    if (!tipoCadastro) { alert('Selecione o Tipo de Cadastro (NC ou REC).'); return; }
    if (!acompanhante) { alert('Selecione o Acompanhamento.'); return; }

    btnSalvar.disabled = true;
    btnSalvar.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Salvando...';

    try {
      const dataCadastro = document.getElementById('dataCadastro').value;
      const payload = {
        nome_completo: nomeCompleto,
        data_nascimento: dataNascimento || '',
        data_cadastro: dataCadastro || new Date().toISOString(),
        endereco: endereco,
        ponto_referencia: pontoReferencia,
        telefone: telefone,
        tipo_cadastro: tipoCadastro,
        acompanhante: acompanhante,
        foto_url: editId ? (editFotoAtual || '') : ''
      };

      let res;
      if (selectedFile) {
        // Tem foto nova: enviar como FormData (multipart)
        const formData = new FormData();
        Object.entries(payload).forEach(([k, v]) => formData.append(k, v));
        formData.append('foto', selectedFile);
        res = await fetch(editId ? 'api/pessoas/' + editId : 'api/pessoas', {
          method: editId ? 'PUT' : 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: formData
        });
      } else {
        // Sem foto: enviar como JSON (evita problemas de boundary no Capacitor WebView)
        res = await fetch(editId ? 'api/pessoas/' + editId : 'api/pessoas', {
          method: editId ? 'PUT' : 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
      }

      const data = await res.json();
      if (res.ok) {
        alert(data.message || (editId ? 'Cadastro atualizado com sucesso!' : 'Cadastro salvo com sucesso!'));
        window.location.href = 'lista.html';
      } else {
        alert(data.error || 'Erro ao salvar cadastro.');
      }
    } catch (err) {
      console.error('Erro:', err);
      alert('Erro de conexão. Verifique se o backend está rodando.');
    }
    btnSalvar.disabled = false;
    btnSalvar.innerHTML = editId
      ? '<i class="fas fa-save me-2"></i>Salvar Alterações'
      : '<i class="fas fa-save me-2"></i>Salvar Cadastro';
  });
})();
</script>
