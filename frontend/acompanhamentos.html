<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro RECNC - Acompanhamentos por Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f5f6fa; }
    .stats-card {
      border-radius: 14px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: transform 0.15s;
    }
    .stats-card:hover { transform: translateY(-2px); }
    .stats-card .icon-circle {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #fff;
    }
    .user-card {
      border-radius: 14px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 16px; overflow: hidden;
    }
    .user-card .user-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
      background: #fff;
    }
    .user-card .user-header:hover { background: #f8f9fa; }
    .user-card .user-body {
      padding: 0; background: #fff;
    }
    .badge-pessoa {
      background: #eef2ff; color: #4f46e5; border-radius: 20px;
      padding: 2px 12px; font-size: 0.78rem; font-weight: 600;
    }
    .badge-admin { background: #dcfce7; color: #15803d; border-radius: 20px; padding: 2px 12px; font-size: 0.78rem; font-weight: 600; }
    .badge-usuario { background: #fef3c7; color: #b45309; border-radius: 20px; padding: 2px 12px; font-size: 0.78rem; font-weight: 600; }
    .table-pessoas { margin-bottom: 0; }
    .table-pessoas th {
      background: #f8f9fa; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.4px; color: #6c757d; border-bottom: 1px solid #dee2e6;
      padding: 10px 20px;
    }
    .table-pessoas td { padding: 10px 20px; vertical-align: middle; font-size: 0.9rem; }
    .empty-state {
      padding: 24px; text-align: center; color: #adb5bd;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
      <i class="fas fa-user-tie me-2"></i>Cadastro RECNC
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Painel</a></li>
        <li class="nav-item"><a class="nav-link" href="lista.html">Lista</a></li>
        <li class="nav-item"><a class="nav-link active" href="acompanhamentos.html"><i class="fas fa-users me-1"></i>Acompanhamentos</a></li>
        <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuários</a></li>
        <li class="nav-item"><a class="nav-link" href="#" id="btnSair"><i class="fas fa-sign-out-alt me-1"></i>Sair</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0"><i class="fas fa-users me-2 text-primary"></i>Acompanhamentos por Usuário</h4>
        <a href="dashboard.html" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Voltar</a>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
          <div class="card stats-card p-3 h-100">
            <div class="d-flex align-items-center gap-3">
              <div class="icon-circle" style="background:#4f46e5;"><i class="fas fa-users"></i></div>
              <div>
                <div class="fs-4 fw-bold" id="totalUsuarios">–</div>
                <small class="text-muted">Usuários</small>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-4">
          <div class="card stats-card p-3 h-100">
            <div class="d-flex align-items-center gap-3">
              <div class="icon-circle" style="background:#0891b2;"><i class="fas fa-user-check"></i></div>
              <div>
                <div class="fs-4 fw-bold" id="totalAcompanhamentos">–</div>
                <small class="text-muted">Acompanhamentos</small>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card stats-card p-3 h-100">
            <div class="d-flex align-items-center gap-3">
              <div class="icon-circle" style="background:#16a34a;"><i class="fas fa-clipboard-list"></i></div>
              <div>
                <div class="fs-4 fw-bold" id="totalCadastrosGeral">–</div>
                <small class="text-muted">Cadastros Gerais</small>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Lista de usuários com seus acompanhamentos -->
      <div id="listaUsuarios">
        <div class="text-center py-5 text-muted">
          <i class="fas fa-spinner fa-spin fa-2x mb-3 d-block"></i>
          Carregando…
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function() {
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token) { window.location.href = 'index.html'; return; }

  // Navbar: esconder link de usuários para não-admin
  if (user.perfil !== 'admin') {
    document.querySelectorAll('a[href="usuarios.html"]').forEach(a => a.parentElement.style.display = 'none');
  }

  const listaUsuarios = document.getElementById('listaUsuarios');
  const tipoLabel = (t) => {
    if (t === 'novo_nascimento') return '<span class="badge badge-pessoa">NC</span>';
    if (t === 'reconciliacao') return '<span class="badge" style="background:#fef3c7;color:#b45309;">REC</span>';
    return '<span class="badge" style="background:#e0f2fe;color:#0369a1;">NCGR</span>';
  };

  async function carregarDados() {
    try {
      const res = await fetch('api/usuarios/acompanhamentos-por-usuario', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 403) {
        listaUsuarios.innerHTML = '<div class="alert alert-danger"><i class="fas fa-lock me-2"></i>Apenas administradores podem acessar esta página.</div>';
        return;
      }
      if (!res.ok) throw new Error('Erro na resposta');
      const data = await res.json();

      // Stats
      document.getElementById('totalUsuarios').textContent = data.usuarios.length;
      document.getElementById('totalAcompanhamentos').textContent = data.total_geral;
      document.getElementById('totalCadastrosGeral').textContent = await buscarTotalGeral();

      if (data.usuarios.length === 0) {
        listaUsuarios.innerHTML = '<div class="empty-state"><i class="fas fa-inbox fa-2x mb-2 d-block"></i>Nenhum usuário encontrado.</div>';
        return;
      }

      let html = '';
      data.usuarios.forEach((u, idx) => {
        const badgePerfil = u.perfil === 'admin'
          ? '<span class="badge-admin">Administrador</span>'
          : '<span class="badge-usuario">Usuário</span>';
        const expanded = idx === 0 ? 'show' : '';
        const chevron = idx === 0 ? 'fa-chevron-up' : 'fa-chevron-down';

        html += `
          <div class="user-card">
            <div class="user-header" data-bs-toggle="collapse" data-bs-target="#collapse-${u.id}" aria-expanded="${idx === 0}">
              <div class="d-flex align-items-center gap-3">
                <div class="icon-circle" style="background:${u.perfil === 'admin' ? '#16a34a' : '#4f46e5'}; width:40px; height:40px; font-size:1rem;">
                  <i class="fas ${u.perfil === 'admin' ? 'fa-user-shield' : 'fa-user'}"></i>
                </div>
                <div>
                  <div class="fw-bold">${u.nome} ${badgePerfil}</div>
                  <small class="text-muted">
                    <i class="fas fa-user-check me-1"></i>${u.total_acompanhamentos} acompanhamento(s)
                  </small>
                </div>
              </div>
              <i class="fas ${chevron} text-muted"></i>
            </div>
            <div class="collapse ${expanded}" id="collapse-${u.id}">
              <div class="user-body">
        `;

        if (u.pessoas && u.pessoas.length > 0) {
          html += `
            <table class="table table-pessoas">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Nome Completo</th>
                  <th>Telefone</th>
                  <th>Tipo</th>
                  <th>Data Cadastro</th>
                </tr>
              </thead>
              <tbody>
          `;
          u.pessoas.forEach(p => {
            html += `
              <tr>
                <td class="text-muted">${p.id}</td>
                <td class="fw-semibold">${p.nome_completo || '-'}</td>
                <td>${p.telefone || '-'}</td>
                <td>${tipoLabel(p.tipo_cadastro)}</td>
                <td>${p.data_cadastro ? new Date(p.data_cadastro).toLocaleDateString('pt-BR') : '-'}</td>
              </tr>
            `;
          });
          html += '</tbody></table>';
        } else {
          html += '<div class="empty-state"><i class="fas fa-user-clock mb-2 d-block"></i>Nenhum acompanhamento atribuído.</div>';
        }

        html += '</div></div></div>';
      });

      listaUsuarios.innerHTML = html;
    } catch (e) {
      console.error('Erro:', e);
      listaUsuarios.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-triangle me-2"></i>Erro de conexão. Verifique sua internet e tente novamente.</div>';
    }
  }

  async function buscarTotalGeral() {
    try {
      const res = await fetch('api/estatisticas', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      return data.totalCadastros;
    } catch (e) { return '–'; }
  }

  // Logout
  document.getElementById('btnSair').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  });

  carregarDados();
})();
</script>
</body>
</html>
