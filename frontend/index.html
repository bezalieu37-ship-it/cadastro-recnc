<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro RECNC - Login</title>
  <meta name="description" content="Sistema de cadastro de pessoas - Cadastro RECNC">
  
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/minimal-fontawesome.min.css">
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark.css">
  <script src="js/theme.js"></script>
  
  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  
  <style>
    .login-page {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      margin: 20px;
    }

    .login-card h2 {
      margin-bottom: 25px;
      color: var(--dark);
      text-align: center;
    }

    .login-card .form-label {
      font-weight: 500;
      color: var(--dark);
    }

    .login-card .form-control {
      border-radius: 8px;
      border: 1px solid #dee2e6;
      padding: 12px 14px;
      font-size: 1rem;
    }

    .login-card .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.25);
    }

    .login-card .btn {
      border-radius: 8px;
      padding: 12px;
      font-weight: 500;
    }

    .logo-text {
      color: var(--primary-color);
      font-weight: bold;
      margin-bottom: 15px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h2><span class="logo-text">Cadastro</span> RECNC</h2>
      
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="nome">Nome</label>
          <input type="text" class="form-control" id="nome" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label" for="senha">Senha</label>
          <input type="password" class="form-control" id="senha" required>
        </div>
        
        <button type="submit" class="btn btn-primary-custom w-100">Entrar</button>
      </form>
      
      <div class="mt-3 text-center">
        <small>Não tem uma conta? <a href="#" id="linkCadastro">Cadastre-se</a></small>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Custom JS -->
  <script>
    // DOM Elements
    const loginForm = document.getElementById('loginForm');
    const linkCadastro = document.getElementById('linkCadastro');
    
    // Login form submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nome = document.getElementById('nome').value.trim();
      const senha = document.getElementById('senha').value.trim();
      
      if (!nome || !senha) {
        alert('Por favor, preencha todos os campos.');
        return;
      }
      
      try {
        const response = await fetch('api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ nome, senha })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Store token and user info
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify({
            id: data.user.id,
            nome: data.user.nome,
            perfil: data.user.perfil
          }));
          
          // Redirect to dashboard
          window.location.href = 'dashboard.html';
        } else {
          alert(data.error || 'Login falhou. Tente novamente.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Erro de conexão. Verifique se o backend está rodando.');
      }
    });
    
    // Link to registration page
    linkCadastro.addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = 'cadastro.html';
    });
  </script>
</body>
</html>
