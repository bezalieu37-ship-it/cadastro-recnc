<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro RECNC - Dashboard</title>
  <meta name="description" content="Painel administrativo - Cadastro RECNC">
  
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/minimal-fontawesome.min.css">
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css">
  
<!-- Font Awesome for specific icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/fontawesome.min.css">
  
  <style>
    .sidebar {
      min-height: 100vh;
      background: var(--dark);
    }
    
    .sidebar a {
      color: #adb5bd;
      text-decoration: none;
      display: block;
      padding: 12px 15px;
      border-radius: 8px;
      margin: 5px 10px;
    }
    
    .sidebar a:hover {
      background-color: rgba(255,255,255,0.1);
      color: white;
    }
    
    .sidebar a.active {
      background-color: var(--primary-color);
      color: white;
    }
    
    .hero-section {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      border-radius: 16px 16px 0 0;
      padding: 40px 20px;
      margin: -20px -20px 30px;
      overflow: hidden;
    }
    
    .hero-section .hero-bg {
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" viewBox="0 0 4 4"><path fill="rgba(255,255,255,0.3)" d="M0 0h4v4H0zM2 2L2 2"/><path fill="rgba(255,255,255,0.1)" d="M0 0h4v4H0zM2 2L2 2"/>' />
      background-size: 40px 40px;
    }
    
    .hero-section .hero-content {
      position: relative;
      z-index: 10;
    }
    
    .hero-section h1 {
      color: white;
      font-weight: 800;
    }
    
    .hero-section p {
      color: rgba(255,255,255,0.8);
    }
    
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s;
}
    
    .stat-card:hover {
      transform: translateY(-2px);
    }
    
    .stat-card .number {
      font-size: 2.5rem;
      font-weight: bold;
    }
    
    .stat-card .label {
      color: #6c757d;
      font-size: 0.9rem;
    }
    
    .stat-card.primary { border-top: 4px solid var(--primary-color); }
    .stat-card.success { border-top: 4px solid var(--success); }
    .stat-card.info { border-top: 4px solid var(--info); }
    
    .card-table th {
      background-color: var(--light);
      border-top: none;
    }
    
    /* Table row actions */
    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    
    .action-btn.editar { background: rgba(40,167,69,0.1); color: var(--success); }
    .action-btn.excluir { background: rgba(220,53,69,0.1); color: var(--danger); }
    
    /* Modal styles */
    .modal-content {
      border: none;
      border-radius: 12px;
    }
    
    .modal-header {
      border-bottom: 1px solid #dee2e6;
      border-radius: 12px 12px 0 0;
    }
    
    /* Reduced table height for mobile */
    @media (max-width: 768px) {
      .table-responsive {
        overflow-x: auto;
      }
      .table th, .table td {
        padding: 8px 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <!-- Sidebar -->
    <div class="row">
      <div class="col-md-2 sidebar py-5">
        <h4 class="text-white text-center mb-4"><i class="fas fa-users me-2"></i>Cadastro RECNC</h4>
        
        <a href="dashboard.html" class="text-decoration-none text-white small">
          <i class="fas fa-tachometer-alt me-2"></i>Painel
        </a>
        <a href="lista.html" class="text-decoration-none text-white small">
          <i class="fas fa-list me-2"></i>Lista
        </a>
        <a href="usuarios.html" class="text-decoration-none text-white small">
          <i class="fas fa-user-tie me-2"></i>Usuários
        </a>
        
        <div class="mt-5">
          <hr class="border-secondary">
          <div class="text-center">
            <small>Bem-vindo, <strong id="userName"></strong></small>
          </div>
          <div class="text-center mt-3">
            <button class="btn btn-outline-light w-100" id="btnLogout">
              <i class="fas fa-sign-out-alt me-2"></i>Sair
            </button>
          </div>
        </div>
      </div>
      
      <!-- Main Content -->
      <div class="col-12 col-md-10 main-content p-4">
        <!-- Hero Section -->
        <div class="hero-section mb-4">
          <div class="hero-bg"></div>
          <div class="hero-content text-center py-5">
            <h1 class="display-4 fw-bold text-white mb-3">Cadastro RECNC</h1>
            <p class="lead text-white-50 mb-4">Sistema de gestão de cadastros</p>
            <div class="d-flex justify-content-center gap-2">
              <a href="formulario.html" class="btn btn-light btn-sm">
                <i class="fas fa-user-plus me-2"></i>Novo Cadastro
              </a>
              <a href="lista.html" class="btn btn-outline-light btn-sm">
                <i class="fas fa-list me-2"></i>Ver Lista
              </a>
            </div>
          </div>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2><i class="fas fa-chart-bar me-2"></i>Painel Administrativo</h2>
          <div>
            <small class="text-secondary" id="dataAtual"></small>
          </div>
        </div>
        
        <!-- Estatísticas Cards -->
        <div class="row g-4 mb-4">
          <!-- Total Pessoas -->
          <div class="stat-card primary col-12 col-sm-6 col-md-3">
            <div class="number" id="totalPessoas">0</div>
            <div class="label">Total de Pessoas</div>
          </div>
          
          <!-- Novos Nascimentos -->
          <div class="stat-card success col-12 col-sm-6 col-md-3">
            <div class="number" id="totalNascimento">0</div>
            <div class="label">Novos Nascimentos</div>
          </div>
          
          <!-- Reconciliações -->
          <div class="stat-card info col-12 col-sm-6 col-md-3">
            <div class="number" id="totalReconciliacao">0</div>
            <div class="label">Reconciliações</div>
          </div>
          
          <!-- Últimos Cadastros -->
          <div class="stat-card secondary col-12 col-sm-6 col-md-3">
            <div class="number" id="ultimosCadastros">0</div>
            <div class="label">Últimos 5</div>
          </div>
        </div>
        
        <!-- Últimos Cadastros -->
        <div class="card fade-in-up">
          <div class="card-header">
            <h5 class="mb-0"><i class="fas fa-calendar me-2"></i>Últimos Cadastros</h5>
          </div>
          <div class="card-body p-0" id="ultimosCadastrosList">
            <!-- Cards serão inseridos aqui via JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Custom JS -->
  <script>
    // Check authentication
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    
    if (!token) {
      window.location.href = 'index.html';
    }
    
    document.getElementById('userName').textContent = user.nome || 'Usuário';
    
    // Logout
    document.getElementById('btnLogout').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    });
    
    // Show current date
    const dataAtual = document.getElementById('dataAtual');
    if (dataAtual) {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      dataAtual.textContent = new Date().toLocaleDateString('pt-BR', options);
    }
    
    // Fetch statistics
    async function carregarEstatisticas() {
      try {
        const response = await fetch('api/estatisticas', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        
        if (response.ok) {
          document.getElementById('totalPessoas').textContent = data.totalPessoas || 0;
          document.getElementById('totalNascimento').textContent = data.totalNascimento || 0;
          document.getElementById('totalReconciliacao').textContent = data.totalReconciliacao || 0;
          document.getElementById('ultimosCadastros').textContent = data.ultimosCadastros || 0;
        }
      } catch (error) {
        console.error('Erro ao carregar estatísticas:', error);
      }
    }
    
    // Fetch últimos cadastros
    async function carregarUltimosCadastros() {
      try {
        const response = await fetch('api/ultimos-cadastros', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        
        if (response.ok && data.length > 0) {
          const container = document.getElementById('ultimosCadastrosList');
          container.innerHTML = '';
          
          data.slice(0, 5).forEach(pessoa => {
            const card = document.createElement('div');
            card.className = 'card p-3 border-start border-primary';
            card.innerHTML = `
              <div class="d-flex w-100 justify-content-between align-items-start">
                <div class="flex-grow-1 me-3">
                  <h6 class="mb-1">${pessoa.nome_completo.substring(0, 30)}...</h6>
                  <small class="text-secondary">${pessoa.telefone}</small>
                </div>
                <small class="text-secondary">${new Date(pessoa.data_cadastro).toLocaleDateString('pt-BR')}</small>
              </div>
            `;
            container.appendChild(card);
          });
        }
      } catch (error) {
        console.error('Erro ao carregar últimos cadastros:', error);
      }
    }
    
    // Initialize
    carregarEstatisticas();
    carregarUltimosCadastros();
  </script>
</body>
</html>
